<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Directory Listing</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  h1 { margin-bottom: 10px; }
  ul { list-style-type: none; padding-left: 0; }
  li { margin: 6px 0; }
  a { text-decoration: none; color: #0645AD; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>Directory Listing</h1>
<ul id="listing"></ul>

<script>
  const owner = "YOUR_USERNAME";
  const repo = "YOUR_REPO_NAME";
  const branch = "main";

  async function fetchDir(path = "") {
    const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
    const res = await fetch(api);
    return res.json();
  }

  async function buildList(path = "") {
    const items = await fetchDir(path);
    const ul = document.createElement("ul");

    for (const item of items) {
      if (item.name === "index.html" && path === "") continue;

      const li = document.createElement("li");

      if (item.type === "dir") {
        li.innerHTML = `<span class="folder">${item.name}/</span>`;
        const subList = await buildList(item.path);
        li.appendChild(subList);
      } else {
        const link = document.createElement("a");
        link.href = item.path;
        link.textContent = item.name;
        li.appendChild(link);
      }

      ul.appendChild(li);
    }

    return ul;
  }

  async function init() {
    const container = document.getElementById("listing");
    const tree = await buildList("");
    container.appendChild(tree);
  }

  init();
</script>
</body>
</html>
